name: Deploy CV site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_IP_SECRET }} >> ~/.ssh/known_hosts

      - name: Build and Deploy
        run: |
          echo "${{ secrets.USER_SECRET }}@${{ secrets.SERVER_IP_SECRET }}:${{ secrets.SERVER_PATH }}"
          npm install
          npm run build
          scp -r $GITHUB_WORKSPACE/dist/* ${{ secrets.USER_SECRET }}@${{ secrets.SERVER_IP_SECRET }}:${{ secrets.SERVER_PATH }}

      - name: Remove stale build files
        # scp never deletes, so hashed files from previous builds pile up on the server.
        # Only build-generated files are pruned: everything in assets/, plus workbox-*.js,
        # registerSW.js and manifest.webmanifest in the root, when this build didn't produce them.
        run: |
          KEEP=" $(cd $GITHUB_WORKSPACE/dist && find . -type f | sed 's|^\./||' | tr '\n' ' ') "
          ssh ${{ secrets.USER_SECRET }}@${{ secrets.SERVER_IP_SECRET }} "cd '${{ secrets.SERVER_PATH }}' && for f in assets/* workbox-*.js registerSW.js manifest.webmanifest; do [ -f \"\$f\" ] || continue; case '$KEEP' in *\" \$f \"*) ;; *) echo \"removing \$f\"; rm -f -- \"\$f\";; esac; done"
